services:

  web:
    build:
      context: .

    command: >
      sh -c "python manage.py migrate --noinput &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 2
      --timeout 60"

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env.prod

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - webnet


  db:
    image: postgres:16

    env_file:
      - .env.prod

    volumes:
      - postgres_prod:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-backsom}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    networks:
      - webnet


volumes:
  postgres_prod:


networks:
  webnet:
